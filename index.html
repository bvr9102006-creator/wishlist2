<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Wishlist</title>
<style>
:root{--bg:#fdf6f0;--card:#fff;--text:#2b2230;--muted:#7a6f80;--accent:#e0577d;--accent2:#f4a259;--line:#f0e2d8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1722;--card:#272031;--text:#f3ecf5;--muted:#a99db0;--line:#3a3046}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Segoe UI',serif;line-height:1.4}
header{text-align:center;padding:48px 20px 24px}
h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-top:8px;font-family:system-ui,sans-serif}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0 8px;font-family:system-ui,sans-serif}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.9rem}
.stat b{color:var(--accent)}
.filters{display:flex;gap:8px;justify-content:center;margin:16px 0 28px;font-family:system-ui,sans-serif}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:.9rem}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(224,87,125,.15)}
.img{aspect-ratio:4/3;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;font-family:system-ui,sans-serif}
.body h3{margin:0;font-size:1.05rem;font-family:Georgia,serif}
.note{color:var(--muted);font-size:.88rem;margin:0}
.price{font-weight:700;color:var(--accent);font-size:1.1rem}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.buy{background:var(--accent);color:#fff;text-decoration:none;padding:8px 16px;border-radius:999px;font-size:.9rem}
.buy:hover{opacity:.9}
label.got{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.card.done{opacity:.55}
.card.done .img::after{content:"¡Recibido! 🎉";position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
.cd-label{margin-top:22px;font-family:system-ui,sans-serif;color:var(--muted)}
.cd{display:flex;gap:10px;justify-content:center;margin-top:10px;font-family:system-ui,sans-serif}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:68px}
.cd b{display:block;font-size:1.7rem;color:var(--accent)}
.cd span{font-size:.75rem;color:var(--muted)}
.cd-big{font-size:1.5rem;color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>✨ Mi Wishlist ✨</h1>
  <div class="sub">Cosas que me encantaría tener</div>
  <div class="cd-label" id="cdl">Faltan para mi cumple 🎂</div>
  <div class="cd" id="cd"></div>
  </header>
<main id="grid"></main>

/* ====== FIN ====== */

const grid = document.getElementById('grid');
let sorted = false, got = {};
try { got = JSON.parse(localStorage.getItem('wishlist-got') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('wishlist-got', JSON.stringify(got)); } catch (e) {} };
const money = n => '$' + Number(n).toLocaleString('es-MX');
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const list = ITEMS.map((it, i) => ({ ...it, i }));
  grid.innerHTML = list.map(it => `
    <article class="card ${got[it.i] ? 'done' : ''}">
      <div class="img">${it.image ? `<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy">` : esc(it.emoji || '🎁')}</div>
      <div class="body">
        <h3>${esc(it.name)}</h3>
        ${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}
        ${it.price ? `<div class="price">${money(it.price)}</div>` : ''}
        <div class="row">
          <a class="buy" href="${esc(it.link)}" target="_blank" rel="noopener">Ver producto</a>
          <label class="got"><input type="checkbox" data-i="${it.i}" ${got[it.i] ? 'checked' : ''}> Ya lo recibí</label>
        </div>
      </div>
    </article>`).join('');
}
grid.addEventListener('change', e => {
  if (e.target.matches('input[data-i]')) { got[e.target.dataset.i] = e.target.checked; save(); render(); }
});

/* Cuenta regresiva: cumpleaños 9 de octubre */
const cd = document.getElementById('cd'), cdl = document.getElementById('cdl');
function tick() {
  const now = new Date();
  let y = now.getFullYear();
  let start = new Date(y, 9, 9), end = new Date(y, 9, 10);
  if (now >= end) { y++; start = new Date(y, 9, 9); }
  if (now >= start && now < end) {
    cdl.textContent = ''; cd.innerHTML = '<div class="cd-big">¡Hoy es mi cumpleaños! 🎉🎂</div>'; return;
  }
  cdl.textContent = 'Faltan para mi cumple 🎂';
  let s = Math.floor((start - now) / 1000);
  const d = Math.floor(s / 86400); s %= 86400;
  const hh = Math.floor(s / 3600); s %= 3600;
  const mm = Math.floor(s / 60), ss = s % 60;
  cd.innerHTML = [[d,'días'],[hh,'horas'],[mm,'min'],[ss,'seg']].map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
}
tick(); setInterval(tick, 1000);
render();
</script>
